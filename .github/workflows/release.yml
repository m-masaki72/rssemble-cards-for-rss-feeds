name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Freemius SDK
        run: |
          curl -L https://github.com/Freemius/wordpress-sdk/archive/refs/heads/master.zip -o freemius.zip
          unzip freemius.zip -d freemius_tmp
          mv freemius_tmp/wordpress-sdk-master rss-display/freemius
          rm -rf freemius.zip freemius_tmp

      - name: Create ZIP
        run: zip -r rss-display.zip rss-display/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rss-display.zip
          generate_release_notes: true
