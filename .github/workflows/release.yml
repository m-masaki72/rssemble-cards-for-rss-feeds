name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create ZIP
        run: zip -r rssemble-cards-for-rss-feeds.zip rssemble-cards-for-rss-feeds/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rssemble-cards-for-rss-feeds.zip
          generate_release_notes: true
