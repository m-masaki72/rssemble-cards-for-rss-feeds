name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create ZIP
        run: zip -r gridify-image-cards-for-rss.zip gridify-image-cards-for-rss/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: gridify-image-cards-for-rss.zip
          generate_release_notes: true
