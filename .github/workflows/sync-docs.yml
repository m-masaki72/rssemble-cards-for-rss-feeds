name: Sync docs CSS

on:
  push:
    branches: [main]
    paths:
      - 'rssemble-cards-for-rss-feeds/assets/css/rssemble-cards-for-rss-feeds.css'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Copy plugin CSS to docs
        run: cp rssemble-cards-for-rss-feeds/assets/css/rssemble-cards-for-rss-feeds.css docs/rssemble-cards-for-rss-feeds.css

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync docs/rssemble-cards-for-rss-feeds.css from plugin CSS"
          file_pattern: docs/rssemble-cards-for-rss-feeds.css
