name: Sync docs CSS

on:
  push:
    branches: [main]
    paths:
      - 'gridify-image-cards-for-rss/assets/css/gridify-image-cards-for-rss.css'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Copy plugin CSS to docs
        run: cp gridify-image-cards-for-rss/assets/css/gridify-image-cards-for-rss.css docs/gridify-image-cards-for-rss.css

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync docs/gridify-image-cards-for-rss.css from plugin CSS"
          file_pattern: docs/gridify-image-cards-for-rss.css
